[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liuer"
version = "0.0.2"
description = "Liuer mimics well-known Python packages and fills practical gaps with small, compatible extensions."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "yihtsy", email = "yihtsy@outlook.com" }
]
keywords = ["python", "utilities", "scipy", "sklearn", "pandas", "itertools", "matplotlib"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.2",
  "scikit-learn>=1.3",
  "seaborn>=0.13",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "ruff>=0.6",
  "twine>=5",
  "wheel>=0.43",
]

[project.urls]
Homepage = "https://github.com/yihtsy/liuer"
Repository = "https://github.com/yihtsy/liuer"
Issues = "https://github.com/yihtsy/liuer/issues"
Changelog = "https://github.com/yihtsy/liuer/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
